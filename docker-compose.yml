version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_management_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@db:5432/student_management?sslmode=disable}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-edumanage-super-secret-key-2026}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: student_management_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-student_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-student_management}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
